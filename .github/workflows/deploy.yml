name: Deploy HTML to Webserver

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: SFTP / FTP Upload
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to Webserver
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Trage hier den korrekten absoluten Server-Pfad ein (z.B. /httpdocs/ki-blog/ oder /html/ki-blog/)
          server-dir: /ki-blog/ 
          # Schließt Git-Metadaten und unnötige Dateien aus, damit nur sauber übertragen wird
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            .github/**
